name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv (provides Python 3.12 and Tkinter)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Lint
        run: uv run --python 3.12 --no-dev --with ruff ruff check .

      - name: Tests
        run: uv run --python 3.12 --no-dev python -m unittest -v
